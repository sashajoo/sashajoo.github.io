# Research themes, shown as cards at the top of the Research section.
# `items` are the key works per theme; a paper links to PubMed by `pmid`.
# `role` is optional and shown after the journal.
- title: "STEAP1 and PSMA as surface targets in prostate cancer"
  venues: "AUA Annual Meeting · Prostate Cancer Foundation · Urologic Oncology"
  summary: >-
    Current work at UCSF. A genome-wide CRISPRi screen for what controls
    STEAP1, the target of new T-cell therapies, drugs that could strengthen
    those therapies, and a review of intraoperative PSMA guidance in robotic
    prostatectomy.
  items:
    - title: "FACS-based whole-genome CRISPRi screen to uncover STEAP1 regulators in prostate cancer"
      meta: "Podium presentation, AUA Annual Meeting, 2025"
    - title: "STEAP1 regulation and combination strategies in prostate cancer"
      meta: "Prostate Cancer Foundation Scientific Retreat, 2025"
    - title: "Emerging role of intraoperative PSMA guidance in robot-assisted radical prostatectomy"
      meta: "Invited review, Urologic Oncology, submitted 2026"
      role: First author
- title: "Intraductal carcinoma of the prostate"
  venues: "Cancer Research · BMC Medicine · Cancer Medicine"
  summary: >-
    My dissertation. Intraductal carcinoma on biopsy as a marker of aggressive
    disease and recurrence after radical prostatectomy, and its genomics and
    DNA-repair defects.
  items:
    - title: "Genomic and evolutionary characterization of concurrent intraductal carcinoma and adenocarcinoma of the prostate"
      meta: "Cancer Research, 2024"
      pmid: "37847513"
      role: Co-first author
    - title: "Homologous recombination deficiency (HRD) score in aggressive prostatic adenocarcinoma with or without intraductal carcinoma of the prostate (IDC-P)"
      meta: "BMC Medicine, 2022"
      pmid: "35864546"
      role: First author
    - title: "Intraductal carcinoma of the prostate in prostate biopsy samples: correlation with aggressive pathological features after radical prostatectomy and prognostic value in high-risk prostate cancer"
      meta: "Asian Journal of Andrology, 2020"
      pmid: "31710002"
      role: First author
    - title: "Molecular complexity of intraductal carcinoma of the prostate"
      meta: "Cancer Medicine, 2024"
      pmid: "38379333"
      role: First author
