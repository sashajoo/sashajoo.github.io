- text: >-
    Day-to-day research mentor to Nicole Klatt in the Chu Lab at UCSF since she
    joined as a pre-medical student. She is now a junior specialist applying for
    her own grant, and I will be a research advisor on her project. In summer
    2026 I also taught a high school intern basic wet-lab techniques and analysis.
- text: >-
    At West China, mentored four junior medical students in Dr. Hao Zeng's group
    in clinical research, and published with each of them: Zhipeng Wang
    (<a href="https://pubmed.ncbi.nlm.nih.gov/34435696/">The Prostate, 2021</a>),
    Zilin Wang (<a href="https://pubmed.ncbi.nlm.nih.gov/33026922/">The Journal of Urology, 2021</a>),
    Yuhao Zeng (<a href="https://pubmed.ncbi.nlm.nih.gov/36865786/">Journal of Multidisciplinary Healthcare, 2023</a>)
    and Nanwei Xu (<a href="https://doi.org/10.1200/jco.2023.41.6_suppl.222">ASCO GU, 2023</a>).
- text: >-
    Deputy Leader (2015–2016) and Team Leader (2016–2017) of the Xinglinfeng
    Youth Volunteer Service Team at West China School of Medicine: regular
    visits to a local nursing home, patient guidance and wayfinding in the
    hospital, and health education sessions in local high schools.
